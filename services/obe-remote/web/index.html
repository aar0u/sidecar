<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>OBE 蓝牙遥控</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="remote-container">
    <!-- Header / Status Bar -->
    <header class="remote-header">
      <div class="brand">
        <img src="assets/images/logo_obe.png" alt="OBE Logo" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-title">OBE 遥控</span>
      </div>
      <button id="btn-device-status" class="status-badge disconnected" aria-label="设备状态">
        <span class="status-dot"></span>
        <span id="status-text">未连接</span>
      </button>
    </header>

    <!-- Top Functional Row (Power & Settings) -->
    <section class="top-row">
      <button class="key-btn key-power" id="key-power" data-code="26" data-key="power" title="电源 (开/待机)">
        <img src="assets/images/btn_power_normal.png" alt="电源" class="btn-img normal">
        <img src="assets/images/btn_power_pressed.png" alt="电源按下" class="btn-img pressed">
      </button>

      <div class="top-center-hint" id="device-hint">
        点击右上角连接设备
      </div>

      <button class="key-btn key-settings" id="key-settings" data-code="172" data-key="settings" title="设置">
        <img src="assets/images/btn_off_normal.png" alt="设置" class="btn-img normal">
        <img src="assets/images/btn_on_pressed.png" alt="设置按下" class="btn-img pressed">
      </button>
    </section>

    <!-- Center D-Pad Navigation Area -->
    <section class="dpad-container">
      <div class="dpad-wheel">
        <!-- Up Arrow -->
        <button class="dpad-arrow dpad-up" id="key-up" data-code="19" data-key="up" title="上">
          <img src="assets/images/btn_tv_arrow_up_normal.png" alt="上" class="btn-img normal">
          <img src="assets/images/btn_tv_arrow_up_pressed.png" alt="上按下" class="btn-img pressed">
        </button>

        <!-- Down Arrow -->
        <button class="dpad-arrow dpad-down" id="key-down" data-code="20" data-key="down" title="下">
          <img src="assets/images/btn_tv_arrow_down_normal.png" alt="下" class="btn-img normal">
          <img src="assets/images/btn_tv_arrow_down_pressed.png" alt="下按下" class="btn-img pressed">
        </button>

        <!-- Left Arrow -->
        <button class="dpad-arrow dpad-left" id="key-left" data-code="21" data-key="left" title="左">
          <img src="assets/images/btn_tv_arrow_left_normal.png" alt="左" class="btn-img normal">
          <img src="assets/images/btn_tv_arrow_left_pressed.png" alt="左按下" class="btn-img pressed">
        </button>

        <!-- Right Arrow -->
        <button class="dpad-arrow dpad-right" id="key-right" data-code="22" data-key="right" title="右">
          <img src="assets/images/btn_tv_arrow_right_normal.png" alt="右" class="btn-img normal">
          <img src="assets/images/btn_tv_arrow_right_pressed.png" alt="右按下" class="btn-img pressed">
        </button>

        <!-- Center OK Button -->
        <button class="dpad-ok" id="key-ok" data-code="23" data-key="ok" title="确认">
          <img src="assets/images/btn_ok_normal.png" alt="OK" class="btn-img normal">
          <img src="assets/images/btn_ok_pressed.png" alt="OK按下" class="btn-img pressed">
        </button>
      </div>
    </section>

    <!-- Lower Functional Rows -->
    <section class="control-rows">
      <!-- Row 1: Home, Back, Menu -->
      <div class="control-row">
        <button class="key-btn" id="key-home" data-code="3" data-key="home" title="主页">
          <img src="assets/images/btn_home_normal.png" alt="主页" class="btn-img normal">
          <img src="assets/images/btn_home_pressed.png" alt="主页按下" class="btn-img pressed">
        </button>
        <button class="key-btn" id="key-back" data-code="4" data-key="back" title="返回">
          <img src="assets/images/btn_back_normal.png" alt="返回" class="btn-img normal">
          <img src="assets/images/btn_back_pressed.png" alt="返回按下" class="btn-img pressed">
        </button>
        <button class="key-btn" id="key-menu" data-code="82" data-key="menu" title="菜单">
          <img src="assets/images/menu_normal.png" alt="菜单" class="btn-img normal">
          <img src="assets/images/menu_pressed.png" alt="菜单按下" class="btn-img pressed">
        </button>
      </div>

      <!-- Row 2: Vol-, Focus, Vol+ -->
      <div class="control-row">
        <button class="key-btn" id="key-vol-down" data-code="25" data-key="vol_down" title="音量减">
          <img src="assets/images/btn_volume_down_normal.png" alt="音量减" class="btn-img normal">
          <img src="assets/images/btn_volume_down_pressed.png" alt="音量减按下" class="btn-img pressed">
        </button>
        <button class="key-btn key-focus" id="key-focus" data-code="131" data-key="focus" title="自动对焦">
          <img src="assets/images/ic_focus_f_normal.png" alt="自动对焦" class="btn-img normal">
          <img src="assets/images/ic_focus_f_pressed.png" alt="对焦按下" class="btn-img pressed">
        </button>
        <button class="key-btn" id="key-vol-up" data-code="24" data-key="vol_up" title="音量加">
          <img src="assets/images/btn_volume_up_normal.png" alt="音量加" class="btn-img normal">
          <img src="assets/images/btn_volume_up_pressed.png" alt="音量加按下" class="btn-img pressed">
        </button>
      </div>
    </section>
  </div>

  <!-- Device Discovery & Connection Modal -->
  <div id="device-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>扫描并连接设备</h3>
        <button id="btn-close-modal" class="btn-close" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <div id="current-device-bar" class="current-device-bar" hidden>
          <span id="current-device-text"></span>
          <button id="btn-disconnect" class="btn-secondary">断开连接</button>
        </div>
        <div class="scan-action-bar">
          <button id="btn-scan" class="btn-primary">开始扫描</button>
          <span id="scan-status-text" class="scan-status">未扫描</span>
        </div>
        <ul id="device-list" class="device-list">
          <!-- Discovered devices will be rendered here -->
        </ul>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
