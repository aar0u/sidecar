name: Release APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build obe-remote binary
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p dist/obe-remote

          # Build for arm64-v8a (embedded native library in APK)
          (cd services/obe-remote && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o ../../android/app/src/main/jniLibs/arm64-v8a/liboberemote.so .)

          # Copy to standalone dist folder for release tarball
          cp android/app/src/main/jniLibs/arm64-v8a/liboberemote.so dist/obe-remote/obe-remote

          # Build for armeabi-v7a
          (cd services/obe-remote && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o ../../android/app/src/main/jniLibs/armeabi-v7a/liboberemote.so .)

          # Package standalone tarball for release asset
          tar -czvf obe-remote-android.tar.gz -C dist/obe-remote obe-remote

      - name: Decode keystore
        run: echo "${{ vars.BASE64_RELEASE_JKS }}" | base64 -d > android/app/release.jks

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Get current date
        id: date
        run: echo "short_timestamp=$(date -u +'%y%m%d')" >> $GITHUB_ENV

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.short_timestamp }}
          name: "Release ${{ env.short_timestamp }}"
          generate_release_notes: true
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/Sidecar.apk
            obe-remote-android.tar.gz
          overwrite_files: true
